<line x1="580" y1="182" x2="598" y2="182" stroke="currentColor" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-g)" />

<!-- Fixed evaluator -->
<rect x="600" y="102" width="144" height="153" rx="9" fill="#f3f4f5" stroke="#d9dcdf" stroke-width="1.5" filter="url(#sh)" />
<text x="672" y="160" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16.5" font-weight="700" fill="#1f2933" text-anchor="middle" dominant-baseline="central">Fixed evaluator</text>
<text x="672" y="185" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#6b7580" text-anchor="middle" dominant-baseline="central">Compares the</text>
<text x="672" y="203" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#6b7580" text-anchor="middle" dominant-baseline="central">output with <tspan font-style="italic">y</tspan></text>

<line x1="750" y1="182" x2="768" y2="182" stroke="currentColor" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-g)" />

